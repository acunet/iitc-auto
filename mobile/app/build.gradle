apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

final BUILD_DATE = new Date().format('yyyy.MM.dd-HH:mm')

def getVersionCodeTimeStamps = { ->
    def git = 'git log -1 --pretty=format:%ct'

    def proc = git.execute()
    proc.waitFor()
    def unixtime = "${proc.in.text}".trim()

    if (unixtime.isEmpty()) {
        println "Failed to get commit date"
        return -1
    }
    return Integer.parseInt(unixtime)
}

def metaFDroid(File apkDir, variant) {
    File outputFile = new File(apkDir, "version_fdroid.txt")
    outputFile.text = """versionName=${variant.versionName}\nversionCode=${variant.versionCode}"""
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "org.exarhteam.iitc_mobile"
        minSdk 21
        targetSdk 36
        versionCode = getVersionCodeTimeStamps()
        versionName "0.42.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
        }
        release {
            if (System.getenv("CI")) {
                storeFile file("../keystore/android.jks")
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias System.getenv("ALIAS_NAME")
                keyPassword System.getenv("ALIAS_PASS")
            } else {
                // We use keystore.properties file for signing data.
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(rootProject.file("keystore.properties")))

                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    // The two Android for Cars runtimes need different artifacts and minSdk values:
    //  - projected  (Android Auto: phone mirrored to the head unit) -> app-projected, minSdk 21 (legacy)
    //  - automotive (AAOS: car OS running on the head unit)         -> app-automotive, minSdk 29,
    //    and it needs a CarAppActivity entry point so the car launcher opens it as a car app.
    // Merging the two into a single variant clashes on the
    // CarAppMetadataHolderService.CAR_HARDWARE_MANAGER meta-data (two different values from the two libraries).
    flavorDimensions 'runtime'
    productFlavors {
        projected {
            dimension 'runtime'
        }
        automotive {
            dimension 'runtime'
            minSdk 29
            applicationIdSuffix '.automotive'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-test-$BUILD_DATE"
            minifyEnabled false
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "ENABLE_CHECK_APP_UPDATES", "false"
        }
        beta {
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta-$BUILD_DATE"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "boolean", "ENABLE_CHECK_APP_UPDATES", System.getenv("ENABLE_CHECK_APP_UPDATES") == "true" ? "true" : "false"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "boolean", "ENABLE_CHECK_APP_UPDATES", System.getenv("ENABLE_CHECK_APP_UPDATES") == "true" ? "true" : "false"
        }
    }

    lint {
        abortOnError true
        checkOnly 'NewApi', 'OnClick', 'MissingSuperCall', 'MissingClass', 'WrongConstant', 'UnspecifiedRegisterReceiverFlag'
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'org.exarhteam.iitc_mobile'

    applicationVariants.all { variant ->
        variant.getAssembleProvider().configure() {
            it.doLast {
                File buildDir = variant.outputs.first().outputFile.parentFile
                metaFDroid(buildDir, variant)
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.akexorcist:localization:1.2.11'
    implementation 'org.apache.commons:commons-text:1.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.melnykov:floatingactionbutton:1.3.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    // Android Auto layer (driving mode): POI templates + StateFlow to pipe portal data
    // from the userscript bridge to the car screen. The two runtime artifacts are split per flavor.
    implementation 'androidx.car.app:app:1.7.0'
    projectedImplementation 'androidx.car.app:app-projected:1.7.0'
    automotiveImplementation 'androidx.car.app:app-automotive:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.12'
    // Real org.json for unit tests: in android.jar this class is only a stub that throws
    // "not mocked", so the parser cannot be tested without a real implementation.
    testImplementation 'org.json:json:20240303'
}

task copyUserscripts(type: Copy) {
    description = 'Updating prebuilt plugins'
    from '../assets'
    into 'src/main/assets'
    include('*')
    include('**/*')
}

preBuild.dependsOn copyUserscripts
